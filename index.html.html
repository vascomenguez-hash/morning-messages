<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Karla:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sunrise-pink: #FFB5C2;
            --sunrise-orange: #FFAA85;
            --sunrise-yellow: #FFF4B5;
            --morning-blue: #E8F4FF;
            --deep-blue: #2C3E50;
            --soft-white: #FFF9F5;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, var(--morning-blue) 0%, var(--sunrise-yellow) 50%, var(--sunrise-pink) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            animation: float 20s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 181, 194, 0.2), transparent);
            border-radius: 50%;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        .container {
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--deep-blue);
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px var(--shadow);
        }

        .header p {
            font-size: 1.1rem;
            color: var(--deep-blue);
            opacity: 0.8;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            animation: fadeIn 1s ease 0.3s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .mode-btn {
            padding: 12px 30px;
            border: 2px solid var(--deep-blue);
            background: var(--soft-white);
            color: var(--deep-blue);
            font-family: 'Karla', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .mode-btn:hover {
            background: var(--deep-blue);
            color: var(--soft-white);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .mode-btn.active {
            background: var(--deep-blue);
            color: var(--soft-white);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease 0.4s backwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--deep-blue);
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 500;
            color: var(--deep-blue);
            margin-bottom: 8px;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(44, 62, 80, 0.2);
            border-radius: 15px;
            font-family: 'Karla', sans-serif;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--deep-blue);
        }

        .image-upload {
            border: 3px dashed rgba(44, 62, 80, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(232, 244, 255, 0.3);
        }

        .image-upload:hover {
            border-color: var(--deep-blue);
            background: rgba(232, 244, 255, 0.5);
        }

        .image-upload.has-image {
            padding: 0;
            border: none;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            display: none;
        }

        #imagePreview.show {
            display: block;
        }

        .upload-text {
            font-size: 1.1rem;
            color: var(--deep-blue);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--sunrise-orange), var(--sunrise-pink));
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Karla', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 170, 133, 0.4);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 170, 133, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .message-display {
            text-align: center;
        }

        .message-photo {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .message-text {
            font-size: 1.3rem;
            line-height: 1.8;
            color: var(--deep-blue);
            font-weight: 400;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 244, 181, 0.3), rgba(255, 181, 194, 0.3));
            border-radius: 15px;
            margin-bottom: 20px;
            font-style: italic;
        }

        .message-time {
            font-size: 0.95rem;
            color: var(--deep-blue);
            opacity: 0.7;
            margin-top: 10px;
        }

        .no-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--deep-blue);
            opacity: 0.6;
        }

        .no-message-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .gallery-btn {
            background: linear-gradient(135deg, var(--morning-blue), var(--sunrise-yellow));
            color: var(--deep-blue);
            margin-top: 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .gallery-item-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: white;
            padding: 15px;
            font-size: 0.85rem;
        }

        .save-wallpaper-btn {
            background: linear-gradient(135deg, var(--deep-blue), #34495e);
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .card {
                padding: 25px;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Good Morning Balll</h1>
            <p>Start each day with love</p>
        </div>

        <div class="mode-toggle">
            <button class="mode-btn active" onclick="switchMode('sender')">Send Message</button>
            <button class="mode-btn" onclick="switchMode('receiver')">View Messages</button>
        </div>

        <div class="card">
            <!-- Sender View -->
            <div id="senderView" class="view active">
                <h2>Send Your Morning Message</h2>
                <form id="messageForm">
                    <div class="form-group">
                        <label for="messageText">Your Message</label>
                        <textarea id="messageText" placeholder="Good morning, beautiful! Hope you have an amazing day..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Upload Photo</label>
                        <div class="image-upload" id="imageUploadArea" onclick="document.getElementById('imageInput').click()">
                            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                            <img id="imagePreview" alt="Preview">
                            <div class="upload-text" id="uploadText">
                                📸 Click to upload a photo
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn">Send Morning Message ✨</button>
                </form>
            </div>

            <!-- Receiver View -->
            <div id="receiverView" class="view">
                <h2>Today's Message 💝</h2>
                <div id="messageDisplay">
                    <div class="no-message">
                        <div class="no-message-icon">🌅</div>
                        <p>No message yet today.<br>Check back soon!</p>
                    </div>
                </div>
                <button class="btn gallery-btn" onclick="showGallery()">View All Messages 📚</button>
            </div>

            <!-- Gallery View -->
            <div id="galleryView" class="view">
                <h2>Message Gallery 💕</h2>
                <div id="galleryGrid" class="gallery-grid"></div>
                <button class="btn" onclick="switchMode('receiver')">Back to Today's Message</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'sender';

        function switchMode(mode) {
            currentMode = mode;
            
            // Update button states
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update views
            document.querySelectorAll('.view').forEach(view => {
                view.classList.remove('active');
            });

            if (mode === 'sender') {
                document.getElementById('senderView').classList.add('active');
            } else if (mode === 'receiver') {
                document.getElementById('receiverView').classList.add('active');
                loadTodayMessage();
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    const uploadText = document.getElementById('uploadText');
                    const uploadArea = document.getElementById('imageUploadArea');
                    
                    preview.src = e.target.result;
                    preview.classList.add('show');
                    uploadText.style.display = 'none';
                    uploadArea.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        }

        async function saveMessage(message, imageData) {
            try {
                const messages = await window.storage.get('all-messages', true);
                const messageList = messages ? JSON.parse(messages.value) : [];
                
                const newMessage = {
                    id: Date.now(),
                    text: message,
                    image: imageData,
                    timestamp: new Date().toISOString(),
                    date: new Date().toLocaleDateString()
                };
                
                messageList.unshift(newMessage);
                
                await window.storage.set('all-messages', JSON.stringify(messageList), true);
                await window.storage.set('latest-message', JSON.stringify(newMessage), true);
                
                return true;
            } catch (error) {
                console.error('Storage error:', error);
                return false;
            }
        }

        document.getElementById('messageForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageText = document.getElementById('messageText').value;
            const imageInput = document.getElementById('imageInput');
            
            if (!messageText && !imageInput.files[0]) {
                alert('Please add a message or photo!');
                return;
            }

            let imageData = null;
            if (imageInput.files[0]) {
                const reader = new FileReader();
                imageData = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(imageInput.files[0]);
                });
            }

            const success = await saveMessage(messageText, imageData);
            
            if (success) {
                alert('✨ Message sent! She can view it now.');
                
                // Reset form
                document.getElementById('messageText').value = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('imagePreview').classList.remove('show');
                document.getElementById('uploadText').style.display = 'block';
                document.getElementById('imageUploadArea').classList.remove('has-image');
            } else {
                alert('Failed to send message. Please try again.');
            }
        });

        async function loadTodayMessage() {
            try {
                const latestMessage = await window.storage.get('latest-message', true);
                const display = document.getElementById('messageDisplay');
                
                if (latestMessage) {
                    const message = JSON.parse(latestMessage.value);
                    const messageDate = new Date(message.timestamp);
                    
                    display.innerHTML = `
                        <div class="message-display">
                            ${message.image ? `<img src="${message.image}" alt="Morning photo" class="message-photo">` : ''}
                            ${message.text ? `<div class="message-text">"${message.text}"</div>` : ''}
                            <div class="message-time">Sent on ${messageDate.toLocaleDateString()} at ${messageDate.toLocaleTimeString()}</div>
                            ${message.image ? '<button class="btn save-wallpaper-btn" onclick="downloadImage()">Download as Wallpaper 📱</button>' : ''}
                        </div>
                    `;
                } else {
                    display.innerHTML = `
                        <div class="no-message">
                            <div class="no-message-icon">🌅</div>
                            <p>No message yet today.<br>Check back soon!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading message:', error);
            }
        }

        async function showGallery() {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById('galleryView').classList.add('active');
            
            try {
                const messages = await window.storage.get('all-messages', true);
                const galleryGrid = document.getElementById('galleryGrid');
                
                if (messages) {
                    const messageList = JSON.parse(messages.value);
                    
                    if (messageList.length > 0) {
                        galleryGrid.innerHTML = messageList.map(msg => `
                            <div class="gallery-item" onclick='viewMessage(${JSON.stringify(msg).replace(/'/g, "&apos;")})'>
                                ${msg.image ? `<img src="${msg.image}" alt="Message photo">` : `<div style="height: 200px; background: linear-gradient(135deg, var(--morning-blue), var(--sunrise-pink)); display: flex; align-items: center; justify-content: center; font-size: 3rem;">💌</div>`}
                                <div class="gallery-item-info">
                                    ${new Date(msg.timestamp).toLocaleDateString()}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        galleryGrid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; padding: 40px; color: var(--deep-blue); opacity: 0.6;">No messages yet</p>';
                    }
                } else {
                    galleryGrid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; padding: 40px; color: var(--deep-blue); opacity: 0.6;">No messages yet</p>';
                }
            } catch (error) {
                console.error('Error loading gallery:', error);
            }
        }

        function viewMessage(message) {
            const display = document.getElementById('messageDisplay');
            const messageDate = new Date(message.timestamp);
            
            display.innerHTML = `
                <div class="message-display">
                    ${message.image ? `<img src="${message.image}" alt="Morning photo" class="message-photo">` : ''}
                    ${message.text ? `<div class="message-text">"${message.text}"</div>` : ''}
                    <div class="message-time">Sent on ${messageDate.toLocaleDateString()} at ${messageDate.toLocaleTimeString()}</div>
                    ${message.image ? '<button class="btn save-wallpaper-btn" onclick="downloadImage()">Download as Wallpaper 📱</button>' : ''}
                </div>
            `;
            
            switchMode('receiver');
        }

        function downloadImage() {
            const img = document.querySelector('.message-photo');
            if (img) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = `morning-message-${new Date().toLocaleDateString()}.jpg`;
                link.click();
            }
        }

        // Load today's message on page load if in receiver mode
        if (currentMode === 'receiver') {
            loadTodayMessage();
        }
    </script>
</body>
</html>
